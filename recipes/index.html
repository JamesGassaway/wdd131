<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="James Gassaway" />
    <meta name="description" content="This is a page that enters data like a credit card - Dynamic Web Fundamentals" />
    <meta property="og:title" content="Page Title">
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Page Description">
    <meta property="og:image" content="URL to an image">
    <meta property="og:url" content="URL of the page">
    <meta name="twitter:card" content="summary_large_image">
    <title>Recipies Website</title>
    <link rel="stylesheet" href="recipes.css" />
    <script defer src="recipes.js"></script>
</head>
<body>
    <header>
        <img src="images/recipe-book.png" alt="recipe book">
        <h1>Recipe Book</h1>
    </header>
    <main>
        <div class="searchbar">
            <input type="text" id="search-input" placeholder="Find a recipe" length="3">
            <button id="search-button"><img src="images/search.svg" alt="recipes icon"></button>
        </div>
        <hr>
        <div class="recipe-container">
            <div class="recipe">
                <div class="recipe-image">
                    <img src="images/apple-crisp.jpg" alt="#">
                </div>
                <div recipe-data>
                    <button>dessert</button>
                    <h2 class="recipe-name">Apple Crisp</h2>
                    <span class="rating" role="img"	aria-label="Rating: 4 out of 5 stars">
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">☆</span>
                    </span>
                    <p class="desc">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
    </footer>
</body>
</html>
